<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>貪食蛇</title>
  <link rel="stylesheet" href="../../css/common.css" />
  <style>
    canvas { background: #0c0f1e; border-radius: 12px; display: block; }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(3, 56px);
      gap: 8px;
      margin-top: 16px;
      justify-content: center;
    }
    .dpad button { font-size: 22px; }
    .dpad .up { grid-column: 2; grid-row: 1; }
    .dpad .left { grid-column: 1; grid-row: 2; }
    .dpad .right { grid-column: 3; grid-row: 2; }
    .dpad .down { grid-column: 2; grid-row: 3; }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="game-toolbar">
      <label>速度
        <select id="speed">
          <option value="140">慢</option>
          <option value="100" selected>普通</option>
          <option value="65">快</option>
        </select>
      </label>
      <label>穿牆
        <select id="wrap">
          <option value="off" selected>關（撞牆結束）</option>
          <option value="on">開（穿牆而過）</option>
        </select>
      </label>
      <button class="btn btn-primary" id="startBtn">開始</button>
      <span class="status">分數 <b id="score">0</b></span>
      <span class="status">最高 <b id="best">0</b></span>
    </div>
    <div class="game-stage" style="flex-direction:column; align-items:center;">
      <canvas id="cv" width="560" height="560"></canvas>
      <div class="dpad">
        <button class="btn up">▲</button>
        <button class="btn left">◀</button>
        <button class="btn right">▶</button>
        <button class="btn down">▼</button>
      </div>
    </div>
    <div class="hint">方向鍵或 WASD 控制方向，也可用下方按鍵。吃到紅點得分。</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="../../js/firebase-config.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/common.js"></script>
  <script src="../../js/gameshell.js"></script>
  <script>
    mountGameHeader("🐍 貪食蛇");

    const cv = document.getElementById("cv");
    const ctx = cv.getContext("2d");
    const N = 20;              // 20x20 格
    const S = cv.width / N;    // 每格像素
    let snake, dir, nextDir, food, score, loopId, running = false;
    let wrap = false;          // 是否穿牆

    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    bestEl.textContent = Scores.getBest("snake") ?? 0;

    function reset() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      scoreEl.textContent = 0;
      placeFood();
      draw();
    }

    function placeFood() {
      while (true) {
        const f = { x: randInt(0, N - 1), y: randInt(0, N - 1) };
        if (!snake.some((s) => s.x === f.x && s.y === f.y)) { food = f; return; }
      }
    }

    function step() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (wrap) {
        // 穿牆：從另一側出來
        head.x = (head.x + N) % N;
        head.y = (head.y + N) % N;
        if (snake.some((s) => s.x === head.x && s.y === head.y)) { gameOver(); return; }
      } else {
        // 撞牆或撞自己
        if (head.x < 0 || head.x >= N || head.y < 0 || head.y >= N ||
            snake.some((s) => s.x === head.x && s.y === head.y)) {
          gameOver();
          return;
        }
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        placeFood();
      } else {
        snake.pop();
      }
      draw();
    }

    function draw() {
      ctx.fillStyle = "#0c0f1e";
      ctx.fillRect(0, 0, cv.width, cv.height);
      // 食物
      ctx.fillStyle = "#ff5c7c";
      roundRect(food.x * S + 2, food.y * S + 2, S - 4, S - 4, 5);
      // 蛇
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? "#23d5ab" : "#4dd07c";
        roundRect(s.x * S + 1, s.y * S + 1, S - 2, S - 2, 5);
      });
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.fill();
    }

    function start() {
      if (running) return;
      wrap = document.getElementById("wrap").value === "on";
      reset();
      running = true;
      const speed = Number(document.getElementById("speed").value);
      loopId = setInterval(step, speed);
    }

    function gameOver() {
      clearInterval(loopId);
      running = false;
      const isBest = Scores.submit("snake", score, "max");
      bestEl.textContent = Scores.getBest("snake");
      showOverlay({ title: "🐍 遊戲結束", message: `分數 ${score}${isBest ? "・新紀錄！" : ""}`, buttonText: "再玩一次", onButton: start });
    }

    function setDir(x, y) {
      // 不能反向
      if (dir.x + x === 0 && dir.y + y === 0) return;
      nextDir = { x, y };
    }

    document.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      if (k === "arrowup" || k === "w") setDir(0, -1);
      else if (k === "arrowdown" || k === "s") setDir(0, 1);
      else if (k === "arrowleft" || k === "a") setDir(-1, 0);
      else if (k === "arrowright" || k === "d") setDir(1, 0);
    });

    document.querySelector(".dpad .up").addEventListener("click", () => setDir(0, -1));
    document.querySelector(".dpad .down").addEventListener("click", () => setDir(0, 1));
    document.querySelector(".dpad .left").addEventListener("click", () => setDir(-1, 0));
    document.querySelector(".dpad .right").addEventListener("click", () => setDir(1, 0));

    document.getElementById("startBtn").addEventListener("click", start);
    reset();
  </script>
</body>
</html>
