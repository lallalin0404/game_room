<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>俄羅斯方塊</title>
  <link rel="stylesheet" href="../../css/common.css" />
  <style>
    .tt-wrap { display: flex; gap: 20px; align-items: flex-start; }
    canvas { background: #0c0f1e; border-radius: 10px; display: block; }
    .side { display: flex; flex-direction: column; gap: 14px; }
    .side .box {
      background: var(--bg-soft); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px; text-align: center;
    }
    .side .box .label { color: var(--text-dim); font-size: 13px; margin-bottom: 4px; }
    .side .box .val { font-size: 22px; font-weight: 700; }
    .dpad {
      display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 52px);
      gap: 8px; margin-top: 16px; justify-content: center;
    }
    .dpad button { font-size: 18px; }
    .dpad .rot { grid-column: 2; grid-row: 1; }
    .dpad .left { grid-column: 1; grid-row: 2; }
    .dpad .down { grid-column: 2; grid-row: 2; }
    .dpad .right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="game-toolbar">
      <button class="btn btn-primary" id="startBtn">開始 / 重來</button>
      <button class="btn" id="pauseBtn">暫停</button>
    </div>
    <div class="game-stage" style="flex-direction:column; align-items:center;">
      <div class="tt-wrap">
        <canvas id="cv" width="320" height="640"></canvas>
        <div class="side">
          <div class="box"><div class="label">分數</div><div class="val" id="score">0</div></div>
          <div class="box"><div class="label">消除行數</div><div class="val" id="lines">0</div></div>
          <div class="box"><div class="label">等級</div><div class="val" id="level">1</div></div>
          <div class="box"><div class="label">下一個</div><canvas id="next" width="80" height="80"></canvas></div>
        </div>
      </div>
      <div class="dpad">
        <button class="btn rot">⟳</button>
        <button class="btn left">◀</button>
        <button class="btn down">▼</button>
        <button class="btn right">▶</button>
      </div>
    </div>
    <div class="hint">← → 移動，↑ 旋轉，↓ 加速下落，空白鍵直接落下。</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="../../js/firebase-config.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/common.js"></script>
  <script src="../../js/gameshell.js"></script>
  <script>
    mountGameHeader("🧱 俄羅斯方塊");

    const COLS = 10, ROWS = 20, CELL = 32;
    const cv = document.getElementById("cv");
    const ctx = cv.getContext("2d");
    const nextCv = document.getElementById("next");
    const nctx = nextCv.getContext("2d");

    const COLORS = ["#0c0f1e", "#23d5ab", "#6ea8ff", "#ffb84d", "#ff5c7c", "#b48cff", "#4dd07c", "#ff7a90"];
    const SHAPES = {
      I: [[1, 1, 1, 1]],
      O: [[2, 2], [2, 2]],
      T: [[0, 3, 0], [3, 3, 3]],
      L: [[0, 0, 4], [4, 4, 4]],
      J: [[5, 0, 0], [5, 5, 5]],
      S: [[0, 6, 6], [6, 6, 0]],
      Z: [[7, 7, 0], [0, 7, 7]],
    };
    const KEYS = Object.keys(SHAPES);

    let board, cur, nextPiece, score, lines, level, dropId, running, paused, dropInterval;

    function emptyBoard() { return Array.from({ length: ROWS }, () => Array(COLS).fill(0)); }

    function randomPiece() {
      const k = KEYS[randInt(0, KEYS.length - 1)];
      const shape = SHAPES[k].map((r) => r.slice());
      return { shape, x: Math.floor((COLS - shape[0].length) / 2), y: 0 };
    }

    function rotate(mat) {
      const rows = mat.length, cols = mat[0].length;
      const res = Array.from({ length: cols }, () => Array(rows).fill(0));
      for (let r = 0; r < rows; r++)
        for (let c = 0; c < cols; c++)
          res[c][rows - 1 - r] = mat[r][c];
      return res;
    }

    function collide(piece, ox = 0, oy = 0, shape = piece.shape) {
      for (let r = 0; r < shape.length; r++) {
        for (let c = 0; c < shape[r].length; c++) {
          if (!shape[r][c]) continue;
          const nx = piece.x + c + ox, ny = piece.y + r + oy;
          if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
          if (ny >= 0 && board[ny][nx]) return true;
        }
      }
      return false;
    }

    function merge() {
      cur.shape.forEach((row, r) => row.forEach((v, c) => {
        if (v) board[cur.y + r][cur.x + c] = v;
      }));
    }

    function clearLines() {
      let cleared = 0;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r].every((v) => v)) {
          board.splice(r, 1);
          board.unshift(Array(COLS).fill(0));
          cleared++;
          r++;
        }
      }
      if (cleared) {
        const pts = [0, 100, 300, 500, 800][cleared] * level;
        score += pts;
        lines += cleared;
        level = Math.floor(lines / 10) + 1;
        dropInterval = Math.max(120, 800 - (level - 1) * 70);
        restartDrop();
        updateStats();
      }
    }

    function updateStats() {
      document.getElementById("score").textContent = score;
      document.getElementById("lines").textContent = lines;
      document.getElementById("level").textContent = level;
    }

    function spawn() {
      cur = nextPiece || randomPiece();
      nextPiece = randomPiece();
      drawNext();
      if (collide(cur)) gameOver();
    }

    function drop() {
      if (!collide(cur, 0, 1)) {
        cur.y++;
      } else {
        merge();
        clearLines();
        spawn();
      }
      draw();
    }

    function hardDrop() {
      while (!collide(cur, 0, 1)) cur.y++;
      drop();
    }

    function move(dx) { if (!collide(cur, dx, 0)) { cur.x += dx; draw(); } }

    function rotateCur() {
      const r = rotate(cur.shape);
      // 簡易踢牆
      for (const ox of [0, -1, 1, -2, 2]) {
        if (!collide(cur, ox, 0, r)) { cur.shape = r; cur.x += ox; draw(); return; }
      }
    }

    function drawCell(context, x, y, colorIdx, size = CELL) {
      context.fillStyle = COLORS[colorIdx];
      context.fillRect(x * size, y * size, size, size);
      context.strokeStyle = "rgba(0,0,0,0.35)";
      context.strokeRect(x * size, y * size, size, size);
    }

    function draw() {
      ctx.fillStyle = "#0c0f1e";
      ctx.fillRect(0, 0, cv.width, cv.height);
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++)
          if (board[r][c]) drawCell(ctx, c, r, board[r][c]);
      cur.shape.forEach((row, r) => row.forEach((v, c) => {
        if (v) drawCell(ctx, cur.x + c, cur.y + r, v);
      }));
    }

    function drawNext() {
      nctx.fillStyle = "#0c0f1e";
      nctx.fillRect(0, 0, nextCv.width, nextCv.height);
      const s = nextPiece.shape;
      const size = 18;
      const offX = (nextCv.width - s[0].length * size) / 2 / size;
      const offY = (nextCv.height - s.length * size) / 2 / size;
      s.forEach((row, r) => row.forEach((v, c) => {
        if (v) drawCell(nctx, offX + c, offY + r, v, size);
      }));
    }

    function restartDrop() {
      if (dropId) clearInterval(dropId);
      dropId = setInterval(() => { if (running && !paused) drop(); }, dropInterval);
    }

    function start() {
      board = emptyBoard();
      score = 0; lines = 0; level = 1; dropInterval = 800;
      running = true; paused = false;
      nextPiece = randomPiece();
      spawn();
      updateStats();
      draw();
      restartDrop();
    }

    function gameOver() {
      running = false;
      clearInterval(dropId);
      const isBest = Scores.submit("tetris", score, "max");
      showOverlay({ title: "🧱 遊戲結束", message: `分數 ${score}${isBest ? "・新紀錄！" : ""}`, buttonText: "再玩一次", onButton: start });
    }

    document.addEventListener("keydown", (e) => {
      if (!running || paused) return;
      const k = e.key;
      if (k === "ArrowLeft") move(-1);
      else if (k === "ArrowRight") move(1);
      else if (k === "ArrowDown") drop();
      else if (k === "ArrowUp") rotateCur();
      else if (k === " ") { e.preventDefault(); hardDrop(); }
    });

    document.querySelector(".dpad .left").addEventListener("click", () => running && !paused && move(-1));
    document.querySelector(".dpad .right").addEventListener("click", () => running && !paused && move(1));
    document.querySelector(".dpad .down").addEventListener("click", () => running && !paused && drop());
    document.querySelector(".dpad .rot").addEventListener("click", () => running && !paused && rotateCur());

    document.getElementById("startBtn").addEventListener("click", start);
    document.getElementById("pauseBtn").addEventListener("click", () => {
      if (!running) return;
      paused = !paused;
      document.getElementById("pauseBtn").textContent = paused ? "繼續" : "暫停";
    });

    // 初始畫面
    board = emptyBoard();
    cur = randomPiece();
    nextPiece = randomPiece();
    draw();
    drawNext();
  </script>
</body>
</html>
